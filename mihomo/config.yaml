rules:
  # 拦截失效/离线的云服务器节点，防止内网设备持续发起无效直连导致日志频繁刷 i/o timeout
  - IP-CIDR,110.42.12.249/32,REJECT,no-resolve

  # 禁用 QUIC (UDP 443)，强制回退 TCP 以确保分流准确与连接稳定
  - AND,((RULE-SET,geolocation-domain),(DST-PORT,443),(NETWORK,UDP)),REJECT

  # 广告 / 拒绝
  - RULE-SET,ads-reject,REJECT

  # LAN / 本地网络 / 私有地址
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve # Tailscale Tailnet 网段
  - RULE-SET,private-domain,DIRECT
  - RULE-SET,private-ip,DIRECT,no-resolve

  # Apple 基础设施：时间同步与推送服务直连
  - DOMAIN,time.apple.com,DIRECT
  - DOMAIN,time.asia.apple.com,DIRECT
  - DOMAIN,push.apple.com,DIRECT
  - DOMAIN,courier.push.apple.com,DIRECT
  - DOMAIN,pushex.apple.com,DIRECT

  # Tailscale：海外 DERP 中继走代理，控制面及其他官方域名直连
  - DOMAIN-REGEX,^derp[a-z0-9-]*\.tailscale\.com$,Global
  - DOMAIN,login.tailscale.com,DIRECT
  - DOMAIN,controlplane.tailscale.com,DIRECT
  - RULE-SET,tailscale-domain,DIRECT

  - DOMAIN-SUFFIX,themoviedb.org,TMDB
