  - DOMAIN-SUFFIX,cm.steampowered.com,DIRECT
  - DOMAIN-SUFFIX,steamstatic.com,DIRECT
  - RULE-SET,steam-domain,Game
  - RULE-SET,epic-domain,Game
  - RULE-SET,nintendo-domain,Game
